name: Build and test the NativeMetal alternative
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-metal:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      FUXI_CI_TESTS: full
    steps:
      - name: Check out public test harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Fetch exact public source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/zgl97/ios-fuxi.git
          git -C source fetch --no-tags --depth=1 origin 4b8faded6e76a4730832144fc3cae34c4419fa51
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 4b8faded6e76a4730832144fc3cae34c4419fa51
          git -C source apply --check ../harness/patches/native-patch-stack.patch
          git -C source apply ../harness/patches/native-patch-stack.patch
          git -C source apply --check ../harness/patches/fuxi-copy-span-builder.patch
          git -C source apply ../harness/patches/fuxi-copy-span-builder.patch
          python3 harness/tests/test-native-patch-stack.py source
          git -C source apply --check ../harness/patches/astc-pixel-smoke.patch
          git -C source apply ../harness/patches/astc-pixel-smoke.patch
          git -C source apply --check ../harness/patches/native-smoke-class.patch
          git -C source apply ../harness/patches/native-smoke-class.patch
          git -C source apply --check ../harness/patches/native-ca-smoke-class.patch
          git -C source apply ../harness/patches/native-ca-smoke-class.patch
          cp harness/patches/nativemetal-fuxi-0004-optional-answers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0005-completion-handlers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0006-uchar3-constant.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0007-nocopy-diagnostics.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0008-nocopy-callers.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0009-copy-span.patch source/tools/patches/
          cp harness/patches/nativemetal-fuxi-0010-nocopy-provenance.patch source/tools/patches/
          cp harness/patches/metal2vulkan-fuxi-0001-copy-span.patch source/tools/patches/
      - name: Fuxi GPU passthrough patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'FXPATCH'
          from pathlib import Path

          # 1) SpringBoard must be able to see a Metal device for UI passthrough.
          p = Path('source/tools/fuxi-metal/ClientGate.hpp')
          t = p.read_text()
          old = 'return !strcmp(s,"SpringBoard") || !strcmp(s,"mediaserverd");'
          new = 'return !strcmp(s,"mediaserverd");'
          assert old in t, 'hiddenClient anchor'
          p.write_text(t.replace(old, new, 1))

          # 2) Accept the two private XR formats backboardd/CA request (550, 554).
          p = Path('source/tools/fuxi-metal/PixelFormats.hpp')
          t = p.read_text()
          old = 'case 1:case 10:case 23:case 25:case 30:case 43:return 2;'
          new = 'case 1:case 10:case 23:case 25:case 30:case 43:case 550:return 2;'
          assert old in t, 'texel-bytes anchor'
          t = t.replace(old, new, 1)
          old = 'case 55:case 70:case 80:case 81:case 94:return 4;'
          new = 'case 55:case 70:case 80:case 81:case 94:case 554:return 4;'
          assert old in t, 'texel-4 anchor'
          t = t.replace(old, new, 1)
          old = 'case 1:case 10:case 23:case 25:case 30:case 43:case 55:case 70:case 80:case 94:case 105:case 115:return true;'
          new = 'case 1:case 10:case 23:case 25:case 30:case 43:case 55:case 70:case 80:case 94:case 105:case 115:case 550:case 554:return true;'
          assert old in t, 'accepted anchor'
          p.write_text(t.replace(old, new, 1))

          # 3) Backend Vulkan mapping: both private formats render as 10-bit BGRA.
          p = Path('source/tools/fuxi-metal/Backend.hpp')
          t = p.read_text()
          old = 'case 94:return VK_FORMAT_A2R10G10B10_UNORM_PACK32;'
          new = 'case 94:case 550:case 554:return VK_FORMAT_A2R10G10B10_UNORM_PACK32;'
          assert old in t, 'backend format anchor'
          p.write_text(t.replace(old, new, 1))

          print('fuxi passthrough patches applied')
          FXPATCH
          grep -n 'mediaserverd' source/tools/fuxi-metal/ClientGate.hpp
          grep -n '550' source/tools/fuxi-metal/PixelFormats.hpp source/tools/fuxi-metal/Backend.hpp
      - name: Fuxi no-copy texture support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'NCPY'
"""Patch FuxiMetal to implement newTextureWithBytesNoCopy for plain BGRA8 2D
textures. Backboardd wraps Apple's raw texture memory with it; the empty
implementation refused every call, which forced whole frames back to CPU.
Strategy: copy the caller bytes into a GPU-visible buffer, then build the
texture as a linear BGRA8 image over it (the validated linear path)."""
from pathlib import Path

p = Path('source/tools/fuxi-metal/Frontend.mm')
t = p.read_text()

old = '''- (id)newTextureWithBytesNoCopy:(void *)bytes length:(NSUInteger)length descriptor:(MTLTextureDescriptor *)d deallocator:(void (^)(void *,NSUInteger))deallocator {CENSUS();FUXI_PHASE(newTexture);
 (void)bytes;(void)deallocator;
 failureLog("FUXI MTL: texture reject bytesNoCopy 1 desc=%s length=%lu (use validated buffer/linear texture path)\\n",textureDescriptorText(d).UTF8String,(unsigned long)length);return nil;
}'''

new = '''- (id)newTextureWithBytesNoCopy:(void *)bytes length:(NSUInteger)length descriptor:(MTLTextureDescriptor *)d deallocator:(void (^)(void *,NSUInteger))deallocator {CENSUS();FUXI_PHASE(newTexture);
 if(clientMode==fuxi::ClientMode::census){unsupported(self,_cmd);return nil;}
 if(!bytes || !d || !length){unsupported(self,_cmd);return nil;}
 /* Only the plain single-mip 2D cases Apple hands us through raw memory: 2D
  * type, one level, one sample, one array slice, shared storage, ShaderRead
  * usage. Anything richer keeps the explicit refusal. */
 if(d.textureType!=MTLTextureType2D || d.mipmapLevelCount!=1 || d.sampleCount!=1 ||
    d.arrayLength!=1 || d.depth!=1 || d.storageMode!=MTLStorageModeShared ||
    (d.textureType==MTLTextureType2D && d.usage!=MTLTextureUsageShaderRead) ||
    !fuxi::textureFormatAccepted((uint32_t)d.pixelFormat) ||
    !textureDescriptorAccepted(d,owner(self)->backend->maxTextureDimension())) {
  failureLog("FUXI MTL: texture reject bytesNoCopy 2 desc=%s length=%lu (shape/usage)\n",
      textureDescriptorText(d).UTF8String,(unsigned long)length);
  return nil;
 }
 size_t row=(size_t)d.width*texelBytes((uint32_t)d.pixelFormat);
 size_t need=row*(size_t)d.height;
 if(!row || need>length) {
  failureLog("FUXI MTL: texture reject bytesNoCopy 3 desc=%s length=%lu need=%zu\n",
      textureDescriptorText(d).UTF8String,(unsigned long)length,need);
  return nil;
 }
 FuxiBuffer *backing=[self newBufferWithLength:need options:MTLResourceStorageModeShared];
 if(!backing){failureLog("FUXI MTL: texture reject bytesNoCopy 4 alloc=%zu\\n",need);return nil;}
 memcpy(backing->_buffer->contents,bytes,need);
 FuxiTexture *t=[FuxiTexture new];t->_device=[self retain];
 t->_descriptorText=[textureDescriptorText(d) copy];t->_cacheMode=d.cpuCacheMode;
 t->_usage=d.usage;t->_shared=YES;t->_memoryless=NO;
 try {
  t->_texture=owner(self)->backend->linearTexture(backing->_buffer,(uint32_t)d.pixelFormat,
      (uint32_t)d.usage,(uint32_t)d.width,(uint32_t)d.height,0,row);
 } catch(const std::exception &e) {
  /* Fall back to an optimal-tiling copy the same size; content is identical
   * because the bytes are already resident in the backing buffer. */
  try {
   t->_texture=owner(self)->backend->allocateTexture((uint32_t)d.pixelFormat,
       (uint32_t)d.usage,(uint32_t)d.width,(uint32_t)d.height,1,2,1);
   backing->_buffer->shadowBacking=true;
   t->_backingBuffer=[backing retain];t->_backingOffset=0;t->_backingRow=row;
  } catch(const std::exception &a) {
   failureLog("FUXI MTL: texture reject bytesNoCopy 5 %s / %s\\n",e.what(),a.what());
   [t release];[backing release];return nil;
  }
 }
 if(deallocator)t->_detachDeallocator=[deallocator copy];
 t->_detachBytes=bytes;t->_detachLength=length;
 return t;
}'''

assert old in t, 'newTextureWithBytesNoCopy anchor missing'
t = t.replace(old, new, 1)
p.write_text(t)
print('patched Frontend.mm: newTextureWithBytesNoCopy implemented')

# FuxiTexture needs the two new fields.
p = Path('source/tools/fuxi-metal/Frontend.mm')
t = p.read_text()
old_iface = '@interface FuxiTexture : FuxiResource { @public fuxi::Texture *_texture;'
new_iface = ('@interface FuxiTexture : FuxiResource { @public fuxi::Texture *_texture;'
             'void *_detachBytes;NSUInteger _detachLength;void (^_detachDeallocator)(void *,NSUInteger);')
assert old_iface in t, 'FuxiTexture ivar anchor missing'
t = t.replace(old_iface, new_iface, 1)
p.write_text(t)
print('patched Frontend.mm: FuxiTexture detach ivars')

NCPY
          grep -n 'bytesNoCopy' source/tools/fuxi-metal/Frontend.mm | head -5



      - name: Build and audit NativeMetal
        shell: bash
        run: |
          set -euo pipefail
          cd source
          xcodebuild -version
          bash tools/ci/build.sh nativemetal
      - name: Upload public-source build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-nativemetal-4b8f
          path: source/tools/out/ci/nativemetal/
          if-no-files-found: warn
          retention-days: 7
